<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Health - Patient Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Aura Health</h2>
            <p>Patient Portal Login (Staging Environment)</p>
        </div>
        <form class="login-form">
            <div class="input-group">
                <label for="patient-id">Patient ID or Email</label>
                <input type="text" id="patient-id" name="patient-id" placeholder="Enter your ID" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="login-btn">Secure Login</button>
        </form>
        <div class="login-footer">
            <a href="#">Forgot Password?</a> | <a href="#">Register for Access</a>
        </div>
    </div>
</body>
</html>
